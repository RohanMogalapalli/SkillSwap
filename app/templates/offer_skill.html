{% extends "base.html" %}

{% block title %}Offer a Skill - SkillSwap{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 text-xs font-bold uppercase tracking-wider mb-2">
            <span>🎓 Mentor Mode</span>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Offer a Skill to Teach</h2>
        <p class="text-sm text-slate-500 mb-6">Earn Skill Credits by mentoring fellow campus students in your areas of expertise.</p>

        <form method="POST" action="{{ url_for('offer_skill') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Select Skill</label>
                <select name="skill_id" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    {% for s in skills %}
                    <option value="{{ s.skill_id }}" {% if request.args.get('skill_id')|string == s.skill_id|string %}selected{% endif %}>
                        {{ s.skill_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Proficiency Level</label>
                <select name="proficiency_level" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    <option value="INTERMEDIATE">Intermediate (Solid foundation)</option>
                    <option value="ADVANCED" selected>Advanced (Extensive project experience)</option>
                    <option value="EXPERT">Expert (Mastery / Competition winner)</option>
                    <option value="BEGINNER">Beginner (Foundational)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Years of Experience</label>
                    <input type="number" step="0.5" min="0" name="experience_years" value="2.0" required 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Available Hours / Week</label>
                    <input type="number" step="1" min="1" max="20" name="available_hours" value="5" required 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition shadow-md shadow-brand-500/20 text-sm mt-4">
                Publish Offering
            </button>
        </form>
    </div>
</div>
{% endblock %}
