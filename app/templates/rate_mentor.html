{% extends "base.html" %}

{% block title %}Rate Mentor - SkillSwap{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 text-xs font-bold uppercase tracking-wider mb-2">
            <span>⭐ Peer Feedback</span>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-1">Rate {{ session_info.mentor_name }}</h2>
        <p class="text-sm text-slate-500 mb-6">Topic: <span class="font-semibold text-slate-800">{{ session_info.skill_name }}</span> (Session #{{ session_info.session_id }})</p>

        <form method="POST" action="{{ url_for('rate_mentor', session_id=session_info.session_id) }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Star Rating (1 to 5 Stars)</label>
                <select name="rating" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-semibold">
                    <option value="5.0" selected>⭐⭐⭐⭐⭐ 5.0 - Exceptional mentorship!</option>
                    <option value="4.5">⭐⭐⭐⭐½ 4.5 - Very good and insightful</option>
                    <option value="4.0">⭐⭐⭐⭐ 4.0 - Good session, learned a lot</option>
                    <option value="3.5">⭐⭐⭐½ 3.5 - Satisfactory</option>
                    <option value="3.0">⭐⭐⭐ 3.0 - Average</option>
                    <option value="2.0">⭐⭐ 2.0 - Needs improvement</option>
                    <option value="1.0">⭐ 1.0 - Poor experience</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Written Feedback</label>
                <textarea name="feedback" rows="4" required placeholder="What did your mentor explain well? How did this session help your learning progress?" 
                          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"></textarea>
            </div>

            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition shadow-md shadow-brand-500/20 text-sm mt-4">
                Submit Review
            </button>
        </form>
    </div>
</div>
{% endblock %}
