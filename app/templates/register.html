{% extends "base.html" %}

{% block title %}Register - SkillSwap{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold uppercase tracking-wider mb-2">
            <span>🎁 50 Skill Credits Bonus</span>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Join Campus SkillSwap</h2>
        <p class="text-sm text-slate-500 mb-6">Create your profile to start mentoring peers and learning skills.</p>
        
        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="e.g. Rahul Sharma" 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">College Email (@vitstudent.ac.in)</label>
                <input type="email" name="email" required placeholder="e.g. yourname.2024@vitstudent.ac.in" pattern=".+@(vitstudent\.ac\.in|vit\.ac\.in)" title="Must be a valid @vitstudent.ac.in or @vit.ac.in email" 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Create a secure password" 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Department</label>
                    <select name="department" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Design">Design</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Biotech">Biotech</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Academic Year</label>
                    <select name="year" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                        <option value="1">1st Year</option>
                        <option value="2" selected>2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Phone Number (Optional)</label>
                <input type="text" name="phone" placeholder="e.g. 9876543210" 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition shadow-md shadow-brand-500/20 text-sm mt-4">
                Create Account &amp; Claim 50 Credits
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
            Already registered? <a href="{{ url_for('login') }}" class="text-brand-600 font-semibold hover:underline">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
